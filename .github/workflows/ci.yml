name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint (ruff)
        # Через `python -m`, чтобы не зависеть от того, попал ли каталог
        # скриптов окружения в PATH (на Windows это отдельная тонкость).
        run: python -m ruff check src tests tools

      - name: Check async tree is generated
        run: python tools/generate_async.py --check

      - name: Check docstrings coverage
        run: python tools/add_docstrings.py --check

      - name: Check documentation integrity
        run: python tools/check_docs.py

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check wheel contents and import
        # Проверяем именно артефакт, который получит пользователь. Логика в
        # Python-скрипте: вызовы python -m zipfile с POSIX-путями и подстановка
        # dist/*.whl в bash на Windows-раннере вели себя иначе, чем на Ubuntu.
        run: python tools/check_wheel.py

  tests-without-pytest:
    # Тесты не должны требовать внешних зависимостей: они написаны на unittest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (stdlib unittest)
        run: python -m unittest discover -s tests -t . -v
