name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint (ruff)
        # Через `python -m`, чтобы не зависеть от того, попал ли каталог
        # скриптов окружения в PATH (на Windows это отдельная тонкость).
        run: python -m ruff check src tests tools

      - name: Check async tree is generated
        run: python tools/generate_async.py --check

      - name: Check docstrings coverage
        run: python tools/add_docstrings.py --check

      - name: Check documentation integrity
        run: python tools/check_docs.py

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Check wheel contents and import
        # Проверяем именно артефакт, который получит пользователь. Колесо
        # распаковывается и импортируется через PYTHONPATH — так проверка не
        # зависит от того, куда pip ставит пакет и какие каталоги уже заняты
        # (на Windows раннере установка поверх окружения вела себя иначе).
        shell: bash
        run: |
          python -m zipfile -e dist/*.whl wheel-check
          PYTHONPATH=wheel-check python -c "import raclib, raclib.asynchronous; print('wheel ok:', raclib.Session, raclib.Client is raclib.asynchronous.AsyncClient)"
          PYTHONPATH=wheel-check python -c "from pathlib import Path; import raclib; assert (Path(raclib.__file__).parent / 'py.typed').exists(), 'py.typed отсутствует в колесе'; print('py.typed на месте')"

  tests-without-pytest:
    # Тесты не должны требовать внешних зависимостей: они написаны на unittest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (stdlib unittest)
        run: python -m unittest discover -s tests -t . -v
