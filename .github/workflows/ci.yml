name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev deps
        run: python -m pip install --upgrade pip pytest ruff

      - name: Lint (ruff)
        run: ruff check src tests tools

      - name: Check async tree is generated
        run: python tools/generate_async.py --check

      - name: Check docstrings coverage
        run: python tools/add_docstrings.py --check

      - name: Check documentation integrity
        run: python tools/check_docs.py

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install wheel and smoke test
        # Проверяем именно то, что получит пользователь: собираем колесо,
        # ставим его и импортируем пакет уже из окружения, а не из src/.
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import raclib, raclib.asynchronous; print('installed', raclib.Session)"

  tests-without-pytest:
    # Тесты не должны требовать внешних зависимостей: они написаны на unittest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (stdlib unittest)
        run: python -m unittest discover -s tests -t . -v
